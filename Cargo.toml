[package]
name = "MMA"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
bytes = "1"
thiserror = "2.0.20"
futures-util = { version = "0.3", features = ["sink"] }
ahash = "0.8.12"
strum = "0.28.0" 
tokio-rustls = "0.26.6"
strum_macros = "0.28.0"

[[example]]
name = "no_tls"
path = "examples/example_no_tls.rs"

[[example]]
name = "with_tls"
path = "examples/example_with_tls.rs"
