
name: Build and publish MMA native libraries

on:
  push:
    tags:
      - 'v*'

# По умолчанию сборке достаточно read.
permissions:
  contents: read

# Не запускать параллельные публикации одного тега.
concurrency:
  group: mma-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-native:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            goos: windows
            goarch: amd64
            library: MMA.dll
            asset: mma-native-windows-amd64.zip
            static_crt: true

          # Linux x64
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
            library: libMMA.so
            asset: mma-native-linux-amd64.zip
            static_crt: false

          # macOS Intel
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
            library: libMMA.dylib
            asset: mma-native-darwin-amd64.zip
            static_crt: false

          # macOS Apple Silicon
          - runner: macos-15
            target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
            library: libMMA.dylib
            asset: mma-native-darwin-arm64.zip
            static_crt: false

    runs-on: ${{ matrix.runner }}

    env:
      RUSTFLAGS: ${{ matrix.static_crt && '-C target-feature=+crt-static' || '' }}
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # --------------------------------------------------
      # Windows MSVC
      # --------------------------------------------------

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # --------------------------------------------------
      # Rust toolchain
      # --------------------------------------------------

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # --------------------------------------------------
      # Build Rust native library
      # --------------------------------------------------

      - name: Build Rust cdylib
        shell: bash
        run: |
          cargo build \
            --locked \
            --release \
            --target "${{ matrix.target }}"

      - name: Verify Rust library
        shell: bash
        run: |
          set -euo pipefail

          library="target/${{ matrix.target }}/release/${{ matrix.library }}"

          if [ ! -f "$library" ]; then
            echo "Rust library not found: $library"
            exit 1
          fi

          echo "Successfully built:"
          ls -lh "$library"

      # --------------------------------------------------
      # macOS dynamic library install name
      # --------------------------------------------------

      - name: Configure macOS dylib install name
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          release_dir="target/${{ matrix.target }}/release"
          library="$release_dir/${{ matrix.library }}"

          install_name_tool \
            -id '@rpath/libMMA.dylib' \
            "$library"

          echo "MMA install name:"
          otool -D "$library"

      # --------------------------------------------------
      # Build C callback bridge - Windows
      # --------------------------------------------------

      - name: Build callback bridge (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseDir = "target/${{ matrix.target }}/release"

          $library = Join-Path $releaseDir "${{ matrix.library }}"
          $importLibrary = Join-Path $releaseDir "MMA.dll.lib"

          if (!(Test-Path $library)) {
              throw "MMA.dll not found"
          }

          if (!(Test-Path $importLibrary)) {
              throw "Import library MMA.dll.lib not found"
          }

          $bridge = Join-Path $releaseDir "mma_go_bridge.dll"

          cl.exe `
            /nologo `
            /O2 `
            /MT `
            /LD `
            /I include `
            /Fo:"$releaseDir\mma_go_bridge.obj" `
            native-bridge\bridge.c `
            /link `
            /LIBPATH:"$releaseDir" `
            "$importLibrary" `
            /OUT:"$bridge"

          if (!(Test-Path $bridge)) {
              throw "Callback bridge was not built"
          }

          Write-Host "Callback bridge successfully built"

      # --------------------------------------------------
      # Build C callback bridge - Linux
      # --------------------------------------------------

      - name: Build callback bridge (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          release_dir="target/${{ matrix.target }}/release"

          library="$release_dir/${{ matrix.library }}"
          bridge="$release_dir/libmma_go_bridge.so"

          cc \
            -O2 \
            -fPIC \
            -shared \
            -I include \
            native-bridge/bridge.c \
            -L "$release_dir" \
            -lMMA \
            -Wl,-rpath,'$ORIGIN' \
            -o "$bridge"

          test -f "$bridge"

          echo "Checking bridge dependencies:"
          ldd "$bridge"

          if ldd "$bridge" | grep -q "not found"; then
            echo "Unresolved shared library dependency"
            exit 1
          fi

      # --------------------------------------------------
      # Build C callback bridge - macOS
      # --------------------------------------------------

      - name: Build callback bridge (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          release_dir="target/${{ matrix.target }}/release"

          bridge="$release_dir/libmma_go_bridge.dylib"

          clang \
            -O2 \
            -fPIC \
            -dynamiclib \
            -I include \
            native-bridge/bridge.c \
            -L "$release_dir" \
            -lMMA \
            -Wl,-rpath,@loader_path \
            -o "$bridge"

          test -f "$bridge"

          echo "Checking bridge dependencies:"
          otool -L "$bridge"

          if ! otool -L "$bridge" | grep -Fq '@rpath/libMMA.dylib'; then
            echo "MMA dylib dependency was not linked correctly"
            exit 1
          fi

      # --------------------------------------------------
      # Package libraries - Windows
      # --------------------------------------------------

      - name: Package native libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseDir = "target/${{ matrix.target }}/release"

          $library = Join-Path $releaseDir "${{ matrix.library }}"
          $bridge = Join-Path $releaseDir "mma_go_bridge.dll"

          if (!(Test-Path $library)) {
              throw "Native library not found"
          }

          if (!(Test-Path $bridge)) {
              throw "Callback bridge not found"
          }

          New-Item -ItemType Directory -Force dist | Out-Null

          $stage = Join-Path $env:RUNNER_TEMP "mma-native-package"

          New-Item -ItemType Directory -Force $stage | Out-Null

          Copy-Item $library (Join-Path $stage "${{ matrix.library }}")
          Copy-Item $bridge (Join-Path $stage "mma_go_bridge.dll")

          $archive = Join-Path $PWD "dist/${{ matrix.asset }}"

          Push-Location $stage

          try {
              Compress-Archive `
                -Path "${{ matrix.library }}", "mma_go_bridge.dll" `
                -DestinationPath $archive `
                -CompressionLevel Optimal
          }
          finally {
              Pop-Location
          }

          $digest = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()

          "$digest  $([System.IO.Path]::GetFileName($archive))" |
              Set-Content -Path "$archive.sha256" -Encoding ascii

          Write-Host "Created $archive"

      # --------------------------------------------------
      # Package libraries - Linux / macOS
      # --------------------------------------------------

      - name: Package native libraries (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          release_dir="target/${{ matrix.target }}/release"

          library="$release_dir/${{ matrix.library }}"

          case "${{ matrix.goos }}" in
            linux)
              bridge="$release_dir/libmma_go_bridge.so"
              ;;
            darwin)
              bridge="$release_dir/libmma_go_bridge.dylib"
              ;;
            *)
              echo "Unsupported platform"
              exit 1
              ;;
          esac

          test -f "$library"
          test -f "$bridge"

          mkdir -p dist

          archive="dist/${{ matrix.asset }}"

          zip -j "$archive" "$library" "$bridge"

          (
            cd dist

            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${{ matrix.asset }}" \
                > "${{ matrix.asset }}.sha256"
            else
              shasum -a 256 "${{ matrix.asset }}" \
                > "${{ matrix.asset }}.sha256"
            fi
          )

          echo "Created $archive"

          ls -lh "$archive" "$archive.sha256"

      # --------------------------------------------------
      # Upload build artifacts
      # --------------------------------------------------

      - name: Upload native artifacts
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # ======================================================
  # Publish GitHub Release
  # ======================================================

  publish-release:
    name: Publish GitHub Release

    needs: build-native

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      # --------------------------------------------------
      # Download all platform artifacts
      # --------------------------------------------------

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: dist
          merge-multiple: true

      # --------------------------------------------------
      # Verify release assets
      # --------------------------------------------------

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail

          assets=(
            mma-native-windows-amd64.zip
            mma-native-linux-amd64.zip
            mma-native-darwin-amd64.zip
            mma-native-darwin-arm64.zip
          )

          for asset in "${assets[@]}"; do
            archive="dist/$asset"
            checksum="$archive.sha256"

            if [ ! -f "$archive" ]; then
              echo "Missing archive: $archive"
              exit 1
            fi

            if [ ! -f "$checksum" ]; then
              echo "Missing checksum: $checksum"
              exit 1
            fi

            (
              cd dist
              sha256sum --check "$asset.sha256"
            )
          done

          echo "All release assets verified."

          ls -lh dist/

      # --------------------------------------------------
      # Publish release
      # --------------------------------------------------

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}

          generate_release_notes: true

          working_directory: dist

          files: |
            *.zip
            *.sha256

          fail_on_unmatched_files: true
          overwrite_files: true
