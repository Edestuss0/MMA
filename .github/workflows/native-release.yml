name: CI and native release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mma-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test Rust and C API
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: cargo test --locked --all-targets
        env:
          CARGO_TERM_COLOR: always
          RUST_BACKTRACE: 1

      - name: Build release library
        run: cargo build --locked --release --lib
        env:
          CARGO_TERM_COLOR: always

      - name: Build both Rust examples
        run: cargo build --locked --release --examples
        env:
          CARGO_TERM_COLOR: always

      - name: Compile both C examples against the public API
        shell: bash
        run: |
          set -euo pipefail

          for source in \
            examples/example_no_tls.c \
            examples/example_with_tls.c
          do
            name="${source##*/}"
            name="${name%.c}"

            echo "Compiling ${source}..."

            cc \
              -std=c11 \
              -D_POSIX_C_SOURCE=200809L \
              -Wall -Wextra -Werror \
              -I include \
              "$source" \
              -L target/release \
              -Wl,-rpath,"$PWD/target/release" \
              -lMMA \
              -pthread \
              -o "target/$name"

            test -x "target/$name"
          done

      - name: Check C++ header compatibility
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/mma_header_smoke.cpp" <<'CPP'
          #include "mma.h"

          int main() {
              MMA_ServerConfig config{};
              MMA_Request request{};
              MMA_Response response{};
              (void)config;
              (void)request;
              (void)response;
              return MMA_OK;
          }
          CPP

          c++ \
            -std=c++17 \
            -Wall -Wextra -Werror \
            -I include \
            -fsyntax-only \
            "$RUNNER_TEMP/mma_header_smoke.cpp"

  build-native:
    name: Build ${{ matrix.os_name }} / ${{ matrix.arch_name }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch_name: amd64
            library: MMA.dll
            import_library: MMA.dll.lib
            asset: mma-native-windows-amd64.zip
            static_crt: true

          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch_name: amd64
            library: libMMA.so
            asset: mma-native-linux-amd64.zip
            static_crt: false

          - runner: macos-15-intel
            target: x86_64-apple-darwin
            os_name: darwin
            arch_name: amd64
            library: libMMA.dylib
            asset: mma-native-darwin-amd64.zip
            static_crt: false

          - runner: macos-15
            target: aarch64-apple-darwin
            os_name: darwin
            arch_name: arm64
            library: libMMA.dylib
            asset: mma-native-darwin-arm64.zip
            static_crt: false

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RUSTFLAGS: ${{ matrix.static_crt && '-C target-feature=+crt-static' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Configure MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Rust stable and target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build native library
        run: cargo build --locked --release --lib --target "${{ matrix.target }}"

      - name: Package native library (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $releaseDir = "target/${{ matrix.target }}/release"
          $library = Join-Path $releaseDir "${{ matrix.library }}"
          $importLibrary = Join-Path $releaseDir "${{ matrix.import_library }}"

          if (!(Test-Path -LiteralPath $library -PathType Leaf)) {
              throw "Native library was not produced: $library"
          }
          if (!(Test-Path -LiteralPath $importLibrary -PathType Leaf)) {
              throw "MSVC import library was not produced: $importLibrary"
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $stage = Join-Path $env:RUNNER_TEMP 'mma-native-package'
          if (Test-Path -LiteralPath $stage) {
              Remove-Item -LiteralPath $stage -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item -LiteralPath $library -Destination $stage
          Copy-Item -LiteralPath $importLibrary -Destination $stage
          Copy-Item -LiteralPath 'include/mma.h' -Destination $stage

          $archive = Join-Path $PWD 'dist/${{ matrix.asset }}'
          Compress-Archive -Path (Join-Path $stage '*') `
              -DestinationPath $archive -CompressionLevel Optimal -Force

          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $assetName = [System.IO.Path]::GetFileName($archive)
          "$digest  $assetName" | Set-Content -LiteralPath "$archive.sha256" -Encoding ascii

          Write-Host "Created $archive"

      - name: Configure macOS dylib install name
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          library="target/${{ matrix.target }}/release/${{ matrix.library }}"
          install_name_tool -id '@rpath/libMMA.dylib' "$library"
          otool -D "$library"

      - name: Package native library (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          release_dir="target/${{ matrix.target }}/release"
          library="$release_dir/${{ matrix.library }}"

          if [[ ! -f "$library" ]]; then
            echo "Native library was not produced: $library" >&2
            exit 1
          fi

          mkdir -p dist
          archive="dist/${{ matrix.asset }}"
          zip -j "$archive" "$library" include/mma.h

          (
            cd dist
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          )

          ls -lh "$archive" "$archive.sha256"

      - name: Upload native package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-${{ matrix.os_name }}-${{ matrix.arch_name }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-native
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download native packages
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: native-*
          path: dist
          merge-multiple: true

      - name: Verify all packages and checksums
        shell: bash
        run: |
          set -euo pipefail

          expected=(
            mma-native-windows-amd64.zip
            mma-native-linux-amd64.zip
            mma-native-darwin-amd64.zip
            mma-native-darwin-arm64.zip
          )

          for asset in "${expected[@]}"; do
            archive="dist/$asset"
            checksum="$archive.sha256"

            test -s "$archive" || {
              echo "Missing or empty release asset: $archive" >&2
              exit 1
            }
            test -s "$checksum" || {
              echo "Missing checksum file: $checksum" >&2
              exit 1
            }

            (cd dist && sha256sum --check "$asset.sha256")
          done

          echo 'All native packages passed SHA-256 verification.'
          ls -lh dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/*.zip
            dist/*.sha256
